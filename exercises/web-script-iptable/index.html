<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Table</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>IP Table</h1>
  <table>
    <thead>
      <tr>
        <th>IP Address</th>
        <th>Subnet Mask</th>
        <th>Version</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    const ipTable = [
      { ip: '192.168.1.1', mask: '255.255.255.0', version: 'v4' },
      { ip: '192.168.1.2', mask: '255.255.255.0', version: 'v4' },
      { ip: '192.168.1.3', mask: '255.255.255.0', version: 'v4' },
    ];
    const tbody = document.querySelector('tbody');

    function createRow({ ip, mask, version }) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${ip}</td><td>${mask}</td><td>${version}</td>`;
      return row;
    }

    ipTable.forEach((item) => {
      const row = createRow(item);
      tbody.appendChild(row);
    });
  </script>
</body>
</html>
