<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Table</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>IP Table</h1>

  <form>
    <label for="ip">IP Address:</label>
    <input type="text" id="ip" name="ip" required>
    <label for="mask">Subnet Mask:</label>
    <input type="text" id="mask" name="mask" required>
    <label for="version">Version:</label>
    <select id="version" name="version">
      <option value="v4">IPv4</option>
      <option value="v6">IPv6</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>IP Address</th>
        <th>Subnet Mask</th>
        <th>Version</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    const ipTable = [
      { ip: '192.168.1.1', mask: '255.255.255.0', version: 'v4' },
      { ip: '192.168.1.2', mask: '255.255.255.0', version: 'v4' },
      { ip: '192.168.1.3', mask: '255.255.255.0', version: 'v4' },
    ];

    const fragment = document.createDocumentFragment();
    const tbody = document.querySelector('tbody');
    const form = document.querySelector('form');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      // const ip = document.getElementById('ip').value;
      // const mask = document.getElementById('mask').value;
      // const version = document.getElementById('version').value;

      const { ip, mask, version } = Object.fromEntries(new FormData(form));

      const newEntry = { ip, mask, version };
      ipTable.push(newEntry);

      const row = createRow(newEntry);
      tbody.appendChild(row);

      form.reset();
    });

    function createRow({ ip, mask, version }) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${ip}</td><td>${mask}</td><td>${version}</td>`;
      return row;
    }

    ipTable.forEach((item) => {
      const row = createRow(item);
      fragment.appendChild(row);
    });

    tbody.appendChild(fragment);
  </script>
</body>
</html>
