<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor — monitoramento de hosts</title>
    <meta
      name="description"
      content="Acompanhe a disponibilidade dos seus hosts com medições automáticas de ping."
    />

    <!--
      Nenhum `<script>` de CDN, nenhum `<link>` de fonte, nenhum `<style>`.

      Tudo isso virou dependência declarada no `package.json` e passou a ser
      responsabilidade do Vite: o `main.js` importa o `style.css`, o `style.css`
      importa o Tailwind e a fonte, e o build resolve a corrente inteira. O que
      sobra aqui é o esqueleto da página — que é o que um `index.html` deveria
      ser.

      O `type="module"` no script lá embaixo é o que permite isso: o navegador
      entende `import`, e o Vite se pendura nessa única porta de entrada para
      descobrir todo o resto.
    -->
  </head>

  <body>
    <!-- Atalho para quem navega por teclado pular a navegação repetida. -->
    <a
      href="#conteudo"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-brand-600 focus:px-4 focus:py-2 focus:text-sm focus:text-white"
      >Pular para o conteúdo</a
    >

    <div id="app"></div>

    <!-- Avisos curtos: sucesso, erro, confirmação de ação. -->
    <div
      id="toasts"
      class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[22rem] max-w-[calc(100vw-2rem)] flex-col gap-2"
      role="status"
      aria-live="polite"
    ></div>

    <div id="modal-root"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
